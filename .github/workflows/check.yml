# Phase 01: the quick check on GitHub.
# - Every push and pull request (the Studio's "Save to game" opens one): the duplicate-name guard and the smoke set
#   (tools/check-quick.py --smoke, about two minutes of checks).
# - Nightly, by hand (Actions -> Check -> Run workflow) and on phase-* tags: the full quick check (about 40 minutes).
# Pictures and results.json are uploaded as an artifact on every run. Picture differences are notes, never failures,
# until phase 03 makes a baseline on this runner.
name: Check

on:
  push:
    branches: ['**']
    tags: ['phase-*']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Pillow
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: No global name defined twice
        run: python tools/check-globals.py
      - name: Quick check, smoke set
        run: python tools/check-quick.py --smoke
      - name: Upload pictures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_number }}
          path: validation/quick/
          if-no-files-found: ignore
          retention-days: 14

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Pillow
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: No global name defined twice
        run: python tools/check-globals.py
      - name: Quick check, full
        run: python tools/check-quick.py
      - name: Upload pictures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_number }}
          path: validation/quick/
          if-no-files-found: ignore
          retention-days: 30
