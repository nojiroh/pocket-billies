# Phase 01: the quick check on GitHub.
# - Every push and pull request (the Studio's "Save to game" opens one): the data text guard and the fast check
#   (tools/check-fast.py: only what must never break, one to three minutes). Studio plan T1.4: a pull request that
#   touches studio/ or game/js/logic/ also runs the Studio against a stand-in for GitHub (check-studio-github.py).
# - Nightly, by hand (Actions -> Check -> Run workflow) and on phase-* tags: the full quick check (about 40 minutes).
# - Phase 02: the Firestore rules tests (firebase/, on the emulator) on every push and pull request, about a minute.
# Pictures and results.json are uploaded as an artifact on every run. Picture differences are notes, never failures.
# - Phase 04a: lint (ESLint: undefined names, names defined twice across scripts, recommended bug rules), the Prettier
#   format check and the Vite build on every push and pull request, about a minute. ESLint replaces check-globals.py.
#   Phase 04b: the game data check (tools/check-data.mjs: the files index.json lists, their schemas, references).
#   Phase 04e: the type check (npm run typecheck: TypeScript on the files that start with // @ts-check, then the
#   logic again with no DOM lib, tsconfig.logic.json; a second).
#   The logic in plain Node (npm run check:logic: game/js/logic/ loads and runs with no browser, a fraction of a second).
#   Phase 13: the unit tests (npm test: tools/test/**/*.test.mjs, node --test, a file per process; check:logic runs them).
# - Phase 13: the game's own full test and diagnostics test, whole and headless (tools/check-quick.py --selftest, about
#   25 minutes), nightly and by hand, in a job of its own outside the full check's time budget. Smoke and the full
#   check run one step of it.
# - Phase 03: the picture baseline is made on this runner (the pictures depend on the renderer) and kept as the asset
#   quick-baseline.zip of the release baseline-<version> (version from game/version.js, e.g. baseline-0.1.0-alpha).
#   It is made on phase-* tags and by hand (Run workflow with "Make the picture baseline"); every other full run
#   downloads it and compares its pictures with it.
name: Check

on:
  push:
    branches: ['**']
    tags: ['phase-*']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: Make the picture baseline from this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 30   # T1.4: the Studio checks add about 5 minutes on Studio and logic pull requests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # tools/build-data.mjs makes data/gamedata.js; tools/check-data.mjs checks the files
        with:
          node-version: '22'
          cache: npm
      - name: Install the tools
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-check.txt
      - name: Install Playwright and Pillow
        run: pip install -r tools/requirements-check.txt
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/requirements-check.txt') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: No game data text that could become HTML
        run: python tools/check-data-text.py
      - name: Fast check
        run: python tools/check-fast.py
      # Studio plan T1.4: on a pull request that touches the Studio or the game's logic, the Studio against a stand-in
      # for GitHub (tools/check-studio-github.py: every section opens, Propose's failure cases, kept drafts, the
      # Studio's self-test, the shared checks and an error blocking Propose, a kit Billie baked and proposed equal to the
      # Node bake; about 3-5 minutes)
      - name: Does this pull request touch the Studio or the logic
        id: studio
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(studio/|game/js/logic/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Studio checks (stand-in GitHub)
        if: steps.studio.outputs.run == 'true'
        run: |
          npm run data
          python tools/check-studio-github.py --only=sections,publish,drafts,studio_test,checks,kit_write,library_swap,repack,density
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-${{ github.run_number }}
          path: validation/fast/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the tools
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types (the files that start with // @ts-check, against game/types)
        run: npm run typecheck
      - name: Unit tests (tools/test/, plain Node, no browser)
        run: npm test
      - name: Slow unit tests (the scene sweeps, tools/unit-tests.mjs)
        run: npm run test:slow
      - name: Game data (files, schemas, references)
        run: npm run check:data
      - name: Modules (generated imports, hooks.js and debug-log-names.js up to date; load order)
        run: npm run check:modules
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build

  rules:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the emulator and the test tools
        run: npm ci
      - name: Firestore rules tests
        run: npm test

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # the baseline release (gh release); nothing else is written
    env:
      GH_TOKEN: ${{ github.token }}
      MAKE_BASELINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.baseline) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/phase-')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # tools/build-data.mjs makes data/gamedata.js from the data files
        with:
          node-version: '22'
      - name: Which version
        # runs version.js itself, so the formatting of that file doesn't matter
        run: echo "PB_VERSION_ID=$(node -e "const self={};eval(require('fs').readFileSync('game/version.js','utf8'));console.log(self.PB_VERSION_ID)")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-check.txt
      - name: Install Playwright and Pillow
        run: pip install -r tools/requirements-check.txt
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/requirements-check.txt') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: No game data text that could become HTML
        run: python tools/check-data-text.py
      - name: Get the picture baseline
        if: env.MAKE_BASELINE != 'true'
        run: |
          if gh release download "baseline-$PB_VERSION_ID" -p quick-baseline.zip -D "$RUNNER_TEMP"; then
            mkdir -p validation && unzip -q "$RUNNER_TEMP/quick-baseline.zip" -d validation
          else
            echo "No baseline for $PB_VERSION_ID yet: pictures are not compared"
          fi
      - name: Quick check, full
        run: python tools/check-quick.py ${{ env.MAKE_BASELINE == 'true' && '--baseline' || '' }}
      - name: Save the picture baseline
        if: env.MAKE_BASELINE == 'true'
        run: |
          (cd validation && zip -qr "$RUNNER_TEMP/quick-baseline.zip" quick-baseline)
          gh release view "baseline-$PB_VERSION_ID" >/dev/null 2>&1 || gh release create "baseline-$PB_VERSION_ID" --target "$GITHUB_SHA" --prerelease --title "Picture baseline $PB_VERSION_ID" --notes "Quick-check pictures from $GITHUB_REF_NAME ($GITHUB_SHA), made on the CI runner. Replaced by the next phase tag or a run with Make the picture baseline."
          gh release upload "baseline-$PB_VERSION_ID" "$RUNNER_TEMP/quick-baseline.zip" --clobber
      - name: Upload pictures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ github.run_number }}
          path: validation/quick/
          if-no-files-found: ignore
          retention-days: 30

  selftest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # tools/build-data.mjs makes data/gamedata.js from the data files
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-check.txt
      - name: Install Playwright and Pillow
        run: pip install -r tools/requirements-check.txt
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/requirements-check.txt') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: The game's full test and diagnostics test, headless
        run: python tools/check-quick.py --selftest
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ github.run_number }}
          path: validation/quick/
          if-no-files-found: ignore
          retention-days: 14
